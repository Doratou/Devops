{{- if .Values.rustfsBucketInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-rustfs-bucket-init
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: {{ .Values.rustfsBucketInit.image }}
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: S3_ENDPOINT
              value: {{ .Values.rustfsBucketInit.endpoint | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.rustfsBucketInit.existingSecret }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set rustfs "$S3_ENDPOINT" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
              {{- range .Values.rustfsBucketInit.buckets }}
              mc mb --ignore-existing "rustfs/{{ . }}"
              {{- end }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
{{- end }}
