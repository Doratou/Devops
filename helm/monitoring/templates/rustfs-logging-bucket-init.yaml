{{- if .Values.rustfsBucketInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-rustfs-bucket-init
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: {{ .Values.rustfsBucketInit.image }}
          env:
            - name: S3_ENDPOINT
              value: {{ .Values.rustfsBucketInit.endpoint | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.rustfsBucketInit.region | default "us-east-1" | quote }}
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          envFrom:
            - secretRef:
                name: {{ .Values.rustfsBucketInit.existingSecret }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              {{- range .Values.rustfsBucketInit.buckets }}
              if ! aws --endpoint-url "$S3_ENDPOINT" s3api head-bucket --bucket "{{ . }}" 2>/dev/null; then
                echo "Creating bucket {{ . }}..."
                aws --endpoint-url "$S3_ENDPOINT" s3 mb "s3://{{ . }}"
              else
                echo "Bucket {{ . }} already exists."
              fi
              {{- end }}
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
