kube-prometheus-stack:
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  grafana:
    enabled: true
    admin:
      existingSecret: "grafana-admin-credentials"
      userKey: admin-user
      passwordKey: admin-password
    service:
      type: LoadBalancer
      port: 3002
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: http://monitoring-loki:3100
        access: proxy
        isDefault: false
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: TraceID
              url: '$${__value.raw}'
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://monitoring-tempo:3200
        access: proxy
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
            filterByTraceID: true
            filterBySpanID: false
          nodeGraph:
            enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  prometheus:
    prometheusSpec:
      retention: 7d
      serviceMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-chunks
        admin: loki-chunks
      s3:
        endpoint: http://doratou-rustfs.doratou.svc.cluster.local:9000
        region: us-east-1
        s3ForcePathStyle: true
        insecure: true
    compactor:
      retention_enabled: true
      delete_request_store: s3
    limits_config:
      retention_period: 336h
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 2Gi
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  minio:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

tempo:
  replicas: 1
  tempo:
    retention: 336h # 14 days
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo-traces
          endpoint: doratou-rustfs.doratou.svc.cluster.local:9000
          region: us-east-1
          insecure: true
          forcepathstyle: true
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

alloy:
  controller:
    type: deployment
    replicas: 1
  alloy:
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    configMap:
      content: |
        // --- 1. Logs Pipeline (Kubernetes Pods -> Loki) ---
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://monitoring-loki:3100/loki/api/v1/push"
          }
        }

        // --- 2. Traces Pipeline (OTLP -> Tempo) ---
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.processor.batch.default.input]
          }
        }

        otelcol.processor.batch "default" {
          output {
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "monitoring-tempo:4317"
            tls {
              insecure = true
            }
          }
        }

rustfsBucketInit:
  enabled: true
  image: public.ecr.aws/aws-cli/aws-cli:latest
  endpoint: http://doratou-rustfs.doratou.svc.cluster.local:9000
  region: us-east-1
  existingSecret: loki-s3-credentials
  buckets:
    - loki-chunks
    - tempo-traces

# Ciphertext overrides are kept in values-sealed.yaml, never plaintext here.
sealedSecrets:
  grafana:
    enabled: false
  loki:
    enabled: false
