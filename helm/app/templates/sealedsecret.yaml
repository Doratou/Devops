{{- if .Values.sealedSecrets.database.enabled }}
{{- $sealedSecret := .Files.Get "sealed-secrets/app-db-credentials.yaml" }}
{{- if empty $sealedSecret }}
{{- fail "sealedSecrets.database.enabled requires helm/app/sealed-secrets/app-db-credentials.yaml" }}
{{- end }}
{{ $sealedSecret | trim }}
{{- end }}
---
{{- if .Values.sealedSecrets.backend.enabled }}
{{- $sealedSecret := .Files.Get "sealed-secrets/doratou-secrets.yaml" }}
{{- if empty $sealedSecret }}
{{- fail "sealedSecrets.backend.enabled requires helm/app/sealed-secrets/doratou-secrets.yaml" }}
{{- end }}
{{ $sealedSecret | trim }}
{{- end }}
