{{- if .Values.docs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api-docs
  labels:
    app.kubernetes.io/name: api-docs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.docs.service.type }}
  selector:
    app.kubernetes.io/name: api-docs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.docs.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
