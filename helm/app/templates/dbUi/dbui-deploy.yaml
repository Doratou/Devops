---
{{- if .Values.dbUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-db-ui
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-db-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-db-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-db-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: adminer
          image: "{{ .Values.dbUi.image.repository }}:{{ .Values.dbUi.image.tag }}"
          imagePullPolicy: {{ .Values.dbUi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: {{ .Release.Name }}-postgresql
          resources:
            {{- toYaml .Values.dbUi.resources | nindent 12 }}
{{- end }}
