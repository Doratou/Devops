---
{{- if .Values.dbUi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db-ui
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-db-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.dbUi.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-db-ui
  ports:
    - name: http
      port: {{ .Values.dbUi.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
