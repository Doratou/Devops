{{- if and .Values.hasIngress .Values.workers.enabled }}
{{- range $name, $worker := .Values.workers.items }}
{{- $svc := $worker.service | default dict }}
{{- $ing := $worker.ingress | default dict }}
{{- if and $worker.enabled $svc.enabled $ing.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-worker-{{ $name }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: {{ $ing.path | default "/ws" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-worker-{{ $name }}
                port:
                  number: {{ $svc.port }}
{{- end }}
{{- end }}
{{- end }}
