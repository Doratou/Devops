{{- if .Values.workers.enabled }}
{{- range $name, $worker := .Values.workers.items }}
{{- if $worker.enabled }}
{{- $svc := $worker.service | default dict }}
{{- $metrics := $worker.metrics | default dict }}
{{- $probes := $worker.probes | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-worker-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: {{ $.Release.Name }}-worker-{{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ $worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Release.Name }}-worker-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Release.Name }}-worker-{{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $.Values.workers.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: worker-{{ $name }}
          image: "{{ $worker.repository }}:{{ $worker.tag | default $.Values.backend.image.tag }}"
          imagePullPolicy: {{ $.Values.workers.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- if or $svc.enabled $metrics.enabled }}
          ports:
            {{- if $svc.enabled }}
            - name: http
              containerPort: {{ $svc.targetPort }}
              protocol: TCP
            {{- end }}
            {{- if and $metrics.enabled (or (not $svc.enabled) (ne (int $metrics.port) (int $svc.targetPort))) }}
            - name: metrics
              containerPort: {{ $metrics.port }}
              protocol: TCP
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-backend-config
            {{- if $.Values.backend.existingSecret }}
            - secretRef:
                name: {{ $.Values.backend.existingSecret }}
            {{- end }}
          env:
            - name: PDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backend.databaseCredentials.existingSecret | quote }}
                  key: {{ $.Values.backend.databaseCredentials.postgresPasswordKey | quote }}
            - name: RDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backend.databaseCredentials.existingSecret | quote }}
                  key: {{ $.Values.backend.databaseCredentials.redisPasswordKey | quote }}
            {{- if $.Values.rabbitmq.enabled }}
            - name: RMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backend.databaseCredentials.existingSecret | quote }}
                  key: {{ $.Values.backend.databaseCredentials.rabbitmqPasswordKey | quote }}
            {{- end }}
            {{- with $worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $probes.path | default "/health" }}
              port: {{ $probes.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $probes.path | default "/health" }}
              port: {{ $probes.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
