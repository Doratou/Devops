{{- if and .Values.rustfs.enabled .Values.rustfs.bucketPolicy.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-rustfs-bucket-policy
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rustfs-bucket-policy
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rustfs-bucket-policy
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply-bucket-policy
          image: "{{ .Values.rustfs.bucketPolicy.image.repository }}:{{ .Values.rustfs.bucketPolicy.image.tag }}"
          imagePullPolicy: {{ .Values.rustfs.bucketPolicy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
          env:
            - name: HOME
              value: /tmp
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.backend.config.RUSTFS_REGION | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rustfs.existingSecret }}
                  key: {{ .Values.rustfs.bucketPolicy.secretKeys.accessKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rustfs.existingSecret }}
                  key: {{ .Values.rustfs.bucketPolicy.secretKeys.secretKey }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ENDPOINT="http://{{ .Release.Name }}-rustfs:{{ .Values.rustfs.service.apiPort }}"
              BUCKET={{ .Values.backend.config.RUSTFS_BUCKET_NAME | quote }}

              until aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$BUCKET" >/dev/null 2>&1; do
                echo "Waiting for bucket '$BUCKET' to be created by backend..."
                sleep 3
              done

              cat <<EOF > /tmp/policy.json
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "PublicReadObjects",
                    "Effect": "Allow",
                    "Principal": "*",
                    "Action": ["s3:GetObject"],
                    "Resource": ["arn:aws:s3:::${BUCKET}/*"]
                  }
                ]
              }
              EOF

              aws --endpoint-url "$ENDPOINT" s3api put-bucket-policy \
                --bucket "$BUCKET" \
                --policy file:///tmp/policy.json

              echo "Public read-only policy applied to bucket '$BUCKET'."
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
