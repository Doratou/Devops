apiVersion: v2
name: app
description: A Helm chart for Doratou in kubernetes
type: application
version: 0.2.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "16.3.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: redis
    version: "20.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
