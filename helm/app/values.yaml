web:
  replicaCount: 1
  image:
    repository: ghcr.io/doratou/frontend
    tag: develop
    pullPolicy: Always
  service:
    type: NodePort
    port: 80
    # TODO: change service to ClusterIP in values, web-service when using ingress-nginx 
    nodePort: 30080
  resources:
    limits:
      cpu: 150m
      memory: 128Mi
    requests:
      cpu: 30m
      memory: 32Mi

hasIngress: false