web:
  replicaCount: 1
  image:
    repository: ghcr.io/doratou/frontend
    tag: a636fd7d59d2099fb1e063d5959eff37e924cf25
    pullPolicy: Always
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  service:
    type: LoadBalancer
    port: 80
  resources:
    limits:
      cpu: 150m
      memory: 128Mi
    requests:
      cpu: 30m
      memory: 32Mi

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/doratou/backend
    tag: 2ae78b5acae79349d0a54de7579d2da4785d5bea
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 3000
  # Supply this Secret outside the chart; never put credentials in values files.
  existingSecret: doratou-secrets
  databaseCredentials:
    existingSecret: app-db-credentials
    postgresPasswordKey: postgresql-password
    redisPasswordKey: redis-password
  config:
    HTTP_DOMAIN: "0.0.0.0"
    HTTP_PORT: "8080"
    PDB_USER: doratou_user
    PDB_HOST: ""
    PDB_PORT: "5432"
    PDB_DB_NAME: doratou
    PDB_SSL_MODE: disable
    RDB_HOST: ""
    RDB_PORT: "6379"
    RDB_DB_NUMBER: "0"
    ACCESS_TOKEN_TTL: 24h
    REFRESH_TOKEN_TTL: 168h
    OTP_TTL: 3m
    OTP_VERIFIED_TTL: 15m
    OTP_DIGITS: "5"
    SEED_USER_NAME: Example User
    SEED_USER_EMAIL: user@example.com
    SEED_USER_PHONE: "+12025550101"
    SEED_ADMIN_NAME: Example Admin
    SEED_ADMIN_EMAIL: admin@example.com
    SEED_ADMIN_PHONE: "+12025550102"
    CAPTCHA_ENABLED: "true"
    CAPTCHA_TTL: 2m
    SMTP_HOST: smtp.gmail.com
    SMTP_HOST_PORT: "587"
    EMAIL_DELIVERY_ENABLED: "false"
    EMAIL_DELIVERY_MODE: SMTP
    FRIENDSHIP_REQUEST_COOLDOWN: 24h
    EMAIL_FONT_BASE_URL: ""
    SEED_GROUP_TITLE: "برنامه تجریش"
    SEED_GROUP_DESCRIPTION: "اول بندری میخوریم بعدش میریم رو پله های باغ فردوس می شینیم"
    GROUP_DIRECT_INVITE_REJECT_COOLDOWN: 24h

    LOGGER_LEVEL: info
    LOGGER_DIRECTORY: logs
    LOGGER_ENVIRONMENT: production
    LOGGER_CONSOLE_ENABLED: "true"
    LOGGER_MAX_SIZE_MB: "20"
    LOGGER_RETENTION_DAYS: "14"

    RUSTFS_ENDPOINT: "doratou-rustfs:9000"
    RUSTFS_BUCKET_NAME: doratou-storage
    RUSTFS_USE_SSL: "false"
    RUSTFS_REGION: us-east-1
    RUSTFS_PUBLIC_URL_PREFIX: "https://dorato.fpna.ir/doratou-storage"
    RUSTFS_MAX_CONCURRENCY: "8"

    POW_CHALLENGE_TTL: 5m
    POW_BLOCK_TTL: 15m
    POW_DIFFICULTY: "16"
    POW_L1_LIMIT: "50"
    POW_L2_LIMIT: "20"

    GOOGLE_CLIENT_ID: "476-4e16n0ketm.apps.googleusercontent.com"
    GOOGLE_REDIRECT_ENDPOINT: "/api/v1/auth/google/callback"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

migration:
  enabled: true
  image:
    repository: ghcr.io/doratou/migration
    tag: 2ae78b5acae79349d0a54de7579d2da4785d5bea
    pullPolicy: Always
  waitForPostgresqlImage: postgres:15-alpine
  backoffLimit: 3
  activeDeadlineSeconds: 900

docs:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/doratou/api-docs
    tag: 2ae78b5acae79349d0a54de7579d2da4785d5bea
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 8080
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# TODO: host volume mode 1001:1001
postgresql:
  enabled: true
  image:
    repository: bitnami/postgresql
    tag: latest
  auth:
    username: doratou_user
    database: doratou
    existingSecret: app-db-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: postgresql-password
  primary:
    persistence:
      enabled: true
      size: 5Gi
      # storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# TODO: host volume mode 1001:1001
redis:
  enabled: true
  image:
    repository: bitnami/redis
    tag: latest
  architecture: standalone
  auth:
    enabled: true
    existingSecret: app-db-credentials
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 1Gi
      # storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
hasIngress: false

# Ciphertext overrides are kept in values-sealed.yaml, never plaintext here.
sealedSecrets:
  database:
    enabled: false

rustfs:
  enabled: true
  image:
    repository: rustfs/rustfs
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001
  existingSecret: doratou-secrets
  persistence:
    enabled: true
    size: 10Gi
    # storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
