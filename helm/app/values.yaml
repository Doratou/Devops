web:
  replicaCount: 1
  image:
    repository: ghcr.io/doratou/frontend
    tag: 7481b8f4d7d399ee6d839f3598352464ee4ec158
    pullPolicy: Always
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 150m
      memory: 128Mi
    requests:
      cpu: 30m
      memory: 32Mi
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/doratou/backend
    tag: 0daa7656ba70b002d6e515e48e3ea28e4f44329d
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 3000
  # Supply this Secret outside the chart; never put credentials in values files.
  existingSecret: doratou-secrets
  databaseCredentials:
    existingSecret: app-db-credentials
    postgresPasswordKey: postgresql-password
    redisPasswordKey: redis-password
    rabbitmqPasswordKey: rabbitmq-password
  config:
    GIN_MODE: "release"
    HTTP_PROTCOL: "http"
    HTTP_DOMAIN: "0.0.0.0"
    HTTP_PORT: "3000"
    PDB_USER: doratou_user
    PDB_HOST: ""
    PDB_PORT: "5432"
    PDB_DB_NAME: doratou
    PDB_SSL_MODE: disable
    RDB_HOST: ""
    RDB_PORT: "6379"
    RDB_DB_NUMBER: "0"
    ACCESS_TOKEN_TTL: 24h
    REFRESH_TOKEN_TTL: 168h
    OTP_TTL: 3m
    OTP_VERIFIED_TTL: 15m
    OTP_DIGITS: "5"
    SEED_USER_NAME: Example User
    SEED_USER_EMAIL: user@example.com
    SEED_USER_PHONE: "+12025550101"
    SEED_ADMIN_NAME: Example Admin
    SEED_ADMIN_EMAIL: admin@example.com
    SEED_ADMIN_PHONE: "+12025550102"
    CAPTCHA_ENABLED: "false"
    CAPTCHA_TTL: 2m
    SMTP_HOST: smtp.gmail.com
    SMTP_HOST_PORT: "587"
    EMAIL_DELIVERY_ENABLED: "true"
    EMAIL_DELIVERY_MODE: SMTP
    FRIENDSHIP_REQUEST_COOLDOWN: 24h
    EMAIL_FONT_BASE_URL: ""
    SEED_GROUP_TITLE: "برنامه تجریش"
    SEED_GROUP_DESCRIPTION: "اول بندری میخوریم بعدش میریم رو پله های باغ فردوس می شینیم"
    GROUP_DIRECT_INVITE_REJECT_COOLDOWN: 24h
    LOGGER_LEVEL: info
    LOGGER_DIRECTORY: logs
    LOGGER_ENVIRONMENT: production
    LOGGER_CONSOLE_ENABLED: "true"
    LOGGER_MAX_SIZE_MB: "20"
    LOGGER_RETENTION_DAYS: "14"
    RUSTFS_ENDPOINT: ""
    RUSTFS_BUCKET_NAME: doratou-storage
    RUSTFS_USE_SSL: "false"
    RUSTFS_REGION: us-east-1
    RUSTFS_PUBLIC_URL_PREFIX: "https://dorato.fpna.ir/doratou-storage"
    RUSTFS_MAX_CONCURRENCY: "8"
    POW_CHALLENGE_TTL: 5m
    POW_BLOCK_TTL: 15m
    POW_DIFFICULTY: "16"
    POW_L1_LIMIT: "50"
    POW_L2_LIMIT: "20"
    # GOOGLE_CLIENT_ID: "476-4e16n0ketm.apps.googleusercontent.com"
    GOOGLE_REDIRECT_ENDPOINT: "/api/v1/auth/google/callback"
    AVALAI_BASE_URL: 'https://api.avalai.ir/v1'
    AVALAI_MODEL: 'gpt-6-luna'
    OAUTH_PROTCOL: "https"
    OAUTH_DOMAIN: "api.dorato.fpna.ir"
    OAUTH_PORT: "443"
    OAUTH_FRONTEND_ENABLED: "true"
    OAUTH_FRONTEND_PROTCOL: "https"
    OAUTH_FRONTEND_DOMAIN: "dorato.fpna.ir"
    OAUTH_FRONTEND_PORT: "443"
    OAUTH_FRONTEND_ENDPOINT: "/auth/callback"
    HTTP_PROXY: "http://10.42.0.1:1081"
    HTTPS_PROXY: "http://10.42.0.1:1081"
    NO_PROXY: "localhost,127.0.0.1,doratou-rustfs,doratou-rabbitmq,doratou-postgresql,doratou-redis,.svc,.cluster.local,10.42.0.0/16,10.43.0.0/16,192.168.6.0/24,api.avalai.ir,dorato.fpna.ir"
    RMQ_HOST: ""
    RMQ_PORT: "5672"
    RMQ_USER: doratou_user
    RMQ_VHOST: "/"
    EMAIL_WORKER_CONCURRENCY: "2"
    EMAIL_WORKER_PREFETCH: "10"
    EMAIL_WORKER_MAX_RETRIES: "3"
    EMAIL_WORKER_RETRY_DELAY: 10s
    SMS_WORKER_CONCURRENCY: "2"
    SMS_WORKER_PREFETCH: "10"
    SMS_WORKER_MAX_RETRIES: "3"
    SMS_WORKER_RETRY_DELAY: 10s
    EMAIL_QUEUE_TTL: 24h
    SMS_QUEUE_TTL: 15m
    WS_QUEUE_TTL: 5m
    DLQ_MESSAGE_TTL: 336h
    NOTIFICATION_WS_REALTIME_TTL: 1m
    NOTIFICATION_WS_STANDARD_TTL: 5m
    NOTIFICATION_WS_NORMAL_TTL: 15m
    NOTIFICATION_SEED_DEMO_EVENTS: "false"
    WS_ENABLED: "true"
    WS_AUTH_REQUIRED: "true"
    WS_INSECURE_SKIP_VERIFY: "true"
    WS_ORIGIN_PATTERNS: ""
    WS_READ_LIMIT_BYTES: "65536"
    WS_SEND_BUFFER_SIZE: "64"
    WS_WRITE_TIMEOUT: "5s"
    WS_PING_INTERVAL: "30s"
    WS_PONG_TIMEOUT: "10s"
    WS_SHUTDOWN_TIMEOUT: "5s"
    WS_MAX_CONNS_PER_USER: "0"
    WS_SLOW_CONSUMER_POLICY: "disconnect"
    WS_PUBSUB_CHANNEL: "doratou:ws:events"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
migration:
  enabled: true
  image:
    repository: ghcr.io/doratou/migration
    tag: 0daa7656ba70b002d6e515e48e3ea28e4f44329d
    pullPolicy: Always
  waitForPostgresqlImage: postgres:15-alpine
  backoffLimit: 3
  activeDeadlineSeconds: 900
docs:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/doratou/api-docs
    tag: 0daa7656ba70b002d6e515e48e3ea28e4f44329d
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 8080
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
# TODO: host volume mode 1001:1001
postgresql:
  enabled: true
  image:
    repository: bitnami/postgresql
    tag: latest
  auth:
    username: doratou_user
    database: doratou
    existingSecret: app-db-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: postgresql-password
  primary:
    persistence:
      enabled: true
      size: 5Gi
      # storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
# TODO: host volume mode 1001:1001
redis:
  enabled: true
  image:
    repository: bitnami/redis
    tag: latest
  architecture: standalone
  auth:
    enabled: true
    existingSecret: app-db-credentials
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 1Gi
      # storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
hasIngress: false
# Ciphertext overrides are kept in values-sealed.yaml, never plaintext here.
sealedSecrets:
  database:
    enabled: false
  backend:
    enabled: false
rustfs:
  enabled: true
  image:
    repository: rustfs/rustfs
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001
  existingSecret: doratou-secrets
  bucketPolicy:
    enabled: true
    image:
      repository: public.ecr.aws/aws-cli/aws-cli
      tag: latest
      pullPolicy: IfNotPresent
    secretKeys:
      accessKey: RUSTFS_ACCESS_KEY_ID
      secretKey: RUSTFS_SECRET_ACCESS_KEY
  persistence:
    enabled: true
    size: 10Gi
    # storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
dbUi:
  enabled: true
  image:
    repository: adminer
    tag: "6.3.1"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 4000
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: 4-management-alpine
    pullPolicy: IfNotPresent
  auth:
    username: doratou_user
    vhost: "/"
    existingSecret: app-db-credentials
    passwordKey: rabbitmq-password
  service:
    type: ClusterIP
    amqpPort: 5672
    managementPort: 15672
  persistence:
    enabled: true
    size: 2Gi
    # storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
workers:
  enabled: true
  pullPolicy: Always
  terminationGracePeriodSeconds: 30
  items:
    email:
      enabled: true
      replicaCount: 1
      repository: ghcr.io/doratou/worker-email
      # tag: ""
      service:
        enabled: false
      probes:
        enabled: false
        path: /health
        port: 9090
      metrics:
        enabled: false
        path: /metrics
        port: 9090
        interval: 30s
      extraEnv: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
    sms:
      enabled: true
      replicaCount: 1
      repository: ghcr.io/doratou/worker-sms
      service:
        enabled: false
      probes:
        enabled: false
        path: /health
        port: 9090
      metrics:
        enabled: false
        path: /metrics
        port: 9090
        interval: 30s
      extraEnv: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
