apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doratou
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Doratou/Devops.git
    targetRevision: main
    path: helm/app
    helm:
      releaseName: doratou
      valueFiles:
        - values-sealed.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: doratou
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
