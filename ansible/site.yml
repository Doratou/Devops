---
- name: Base configuration for all hosts
  hosts: all
  gather_facts: true
  become: true
  vars_files:
    - group_vars/production/vault.yml

  roles:
    - role: common
      tags:
        - common
        - prepare

    - role: xray
      tags:
        - xray
        - vpn

    - role: k3s
      tags:
        - k3s
        - cluster

    - role: helm_cli
      tags:
        - helm
        - helm_cli

    - role: headlamp
      tags:
        - headlamp
        - dashboard

    - role: sealed_secret
      tags:
        - sealed_secret
        - secret
    
    - role: ingress_nginx
      tags: 
        - ingress
        - ingress-nginx

    - role: helm_bootstrap
      tags:
        - helm_bootstrap
        - gitops
