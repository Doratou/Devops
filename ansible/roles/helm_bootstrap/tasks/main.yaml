---
- name: Add Argo CD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
    state: present

- name: Wait for a Kubernetes node to become Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: helm_bootstrap_nodes
  retries: 30
  delay: 5
  until:
    - helm_bootstrap_nodes.resources | length > 0
    - helm_bootstrap_nodes.resources | selectattr('status.conditions', 'defined') | list | length > 0
    - >-
      helm_bootstrap_nodes.resources
      | selectattr('status.conditions', 'defined')
      | map(attribute='status.conditions')
      | flatten
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list
      | length > 0

- name: Install Argo CD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    create_namespace: true
    state: present
    wait: true
    timeout: "{{ helm_bootstrap_install_timeout }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      server:
        extraArgs:
          - --insecure
        service:
          type: LoadBalancer
          servicePortHttp: 3001
          servicePortHttps: 3443

- name: Wait for Argo CD Application CRD to be ready
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: helm_bootstrap_argocd_crd
  retries: 20
  delay: 3
  until: helm_bootstrap_argocd_crd.resources | length > 0

- name: Wait for Argo CD initial admin secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: argocd
    name: argocd-initial-admin-secret
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: helm_bootstrap_argocd_admin_secret
  retries: 30
  delay: 5
  until: helm_bootstrap_argocd_admin_secret.resources | length > 0

- name: Extract Argo CD admin password
  ansible.builtin.set_fact:
    helm_bootstrap_argocd_admin_password: >-
      {{
        helm_bootstrap_argocd_admin_secret.resources[0].data.password
        | b64decode
      }}

- name: Display Argo CD access information
  ansible.builtin.debug:
    msg:
      - "=========================================================="
      - "Argo CD has been installed successfully."
      - "Username: admin"
      - "Password: {{ helm_bootstrap_argocd_admin_password }}"
      - "Access: http://<SERVER_IP>:3001"  # NOSONAR: internal bootstrap HTTP endpoint (--insecure)
      - "=========================================================="

- name: Fetch GitHub SSH host keys on port 443
  ansible.builtin.command: ssh-keyscan -p 443 ssh.github.com
  register: helm_bootstrap_github_ssh_known_hosts
  changed_when: false

- name: Configure Argo CD SSH known hosts for port 443
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-ssh-known-hosts-cm
        namespace: argocd
        labels:
          app.kubernetes.io/name: argocd-ssh-known-hosts-cm
          app.kubernetes.io/part-of: argocd
      data:
        ssh_known_hosts: "{{ helm_bootstrap_github_ssh_known_hosts.stdout }}"

- name: Configure private GitOps repository credentials
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: repo-doratou-devops
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      stringData:
        type: git
        url: ssh://git@ssh.github.com:443/Doratou/Devops.git
        sshPrivateKey: "{{ helm_bootstrap_vault_argocd_gitops_private_key }}"
  no_log: true
  tags:
    - vault

- name: Deploy Doratou Argo CD Application
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition: "{{ lookup('ansible.builtin.file', helm_bootstrap_gitops_manifest) | from_yaml }}"
  tags:
    - vault
