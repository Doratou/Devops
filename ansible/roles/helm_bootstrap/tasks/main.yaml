---
- name: Check if Helm is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_bootstrap_helm_binary

- name: Download Helm installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: "0700"
  when: not helm_bootstrap_helm_binary.stat.exists

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get_helm.sh
  when: not helm_bootstrap_helm_binary.stat.exists
  changed_when: true

- name: Add Argo CD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
    state: present

- name: Wait for a Kubernetes node to become Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: helm_bootstrap_nodes
  retries: 30
  delay: 5
  until:
    - helm_bootstrap_nodes.resources | length > 0
    - helm_bootstrap_nodes.resources | selectattr('status.conditions', 'defined') | list | length > 0
    - >-
      helm_bootstrap_nodes.resources
      | selectattr('status.conditions', 'defined')
      | map(attribute='status.conditions')
      | flatten
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list
      | length > 0

- name: Install Argo CD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    create_namespace: true
    state: present
    wait: true
    timeout: "{{ helm_bootstrap_install_timeout }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      server:
        extraArgs:
          - --insecure

- name: Wait for Argo CD Application CRD to be ready
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: helm_bootstrap_argocd_crd
  retries: 20
  delay: 3
  until: helm_bootstrap_argocd_crd.resources | length > 0

- name: Wait for Argo CD initial admin secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: argocd
    name: argocd-initial-admin-secret
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: helm_bootstrap_argocd_admin_secret
  retries: 30
  delay: 5
  until: helm_bootstrap_argocd_admin_secret.resources | length > 0

- name: Extract Argo CD admin password
  ansible.builtin.set_fact:
    helm_bootstrap_argocd_admin_password: >-
      {{
        helm_bootstrap_argocd_admin_secret.resources[0].data.password
        | b64decode
      }}

- name: Display Argo CD access information
  ansible.builtin.debug:
    msg:
      - "=========================================================="
      - "Argo CD has been installed successfully."
      - "Username: admin"
      - "Password: {{ helm_bootstrap_argocd_admin_password }}"
      - "Access: kubectl port-forward svc/argocd-server -n argocd 8080:80"
      - "=========================================================="

- name: Deploy Doratou Argo CD Application
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition: "{{ lookup('ansible.builtin.file', helm_bootstrap_gitops_manifest) | from_yaml }}"
