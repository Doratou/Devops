---
- name: Add Headlamp Helm repository
  kubernetes.core.helm_repository:
    name: "{{ headlamp_chart_repository_name }}"
    repo_url: "{{ headlamp_chart_repository_url }}"
    state: present

# - name: Install Headlamp with chart defaults
