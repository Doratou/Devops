name: Chart CI Quality Gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/CI-Chart.yml"
  push:
    branches:
      - main
      - feat/app-chart
      - feat/ci
    paths:
      - "helm/**"
      - ".github/workflows/CI-Chart.yml"

env:
  GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-lint:
    name: Helm Lint & Dependency Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.16.3"

      - name: Add Helm Repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Build Chart Dependencies
        run: |
          helm dependency build ./helm/app

      - name: Lint Chart
        run: |
          helm lint ./helm/app

  kubeconform:
    name: Manifest Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.16.3"

      - name: Add Helm Repositories & Build Dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build ./helm/app

      - name: Install Kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Rendered Manifests
        run: |
          helm template pulseops ./helm/app > /tmp/pulseops-rendered.yaml
          kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/pulseops-rendered.yaml

  trivy-config:
    name: IaC Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # - name: Run Trivy Config Scan
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     scan-type: "config"
      #     scan-ref: "./helm/app"
      #     exit-code: "1"
      #     severity: "CRITICAL,HIGH"
      #     skip-dirs: "helm/app/charts"
      #     hide-progress: true

      - name: Run Trivy Config Scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            aquasec/trivy:0.76.1 \
            config \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --skip-dirs charts \
            /workspace/helm/app

  chart-testing:
    name: Chart Install Test (KinD)
    runs-on: ubuntu-latest
    needs: [helm-lint, kubeconform]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.16.3"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Setup Chart Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Create KinD Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Create disposable chart-test credentials
        run: |
          kubectl create namespace chart-testing
          kubectl create secret generic app-db-credentials \
            --namespace chart-testing \
            --from-literal=postgres-password=ci-only-admin-password \
            --from-literal=postgresql-password=ci-only-user-password \
            --from-literal=redis-password=ci-only-redis-password

      - name: Add Helm Repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Run Chart Install Test
        run: |
          ct install --config .github/ct.yaml --charts helm/app \
            --namespace chart-testing \
            --helm-extra-set-args "--set=sealedSecrets.database.enabled=false"
